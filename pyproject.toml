[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlbricks-builder"
version = "0.7.49"
description = "Hierarchical visual node builder for MLBricks models in Jupyter, Kaggle and Colab."
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]

authors = [
  { name = "Zameer Hussain" },
  { name = "Akhtar Hussain" }
]

dependencies = [
  "ipython>=8",
  "ipywidgets>=8",
  "huggingface_hub>=0.24",
  "mlbricks @ git+https://github.com/MlBricks/MLBricks.git"
]

[project.urls]
Homepage = "https://github.com/MlBricks/MLBricks-Builder"
Repository = "https://github.com/MlBricks/MLBricks-Builder"
Issues = "https://github.com/MlBricks/MLBricks-Builder/issues"
License = "https://polyformproject.org/licenses/noncommercial/1.0.0"
"MLBricks" = "https://github.com/MlBricks/MLBricks"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlbricks_builder*"]

[tool.setuptools.package-data]
mlbricks_builder = ["static/*.js", "static/*.css", "static/*.png", "*.json"]


[project.optional-dependencies]
data = [
  "datasets>=2.18",
  "kagglehub>=0.3",
  "transformers>=4.40",
  "pandas>=2",
  "pyarrow>=15",
  "pillow>=10",
  "numpy>=1.26"
]

cloud = [
  "boto3>=1.34",
  "google-cloud-storage>=2.16",
  "google-auth>=2.29",
  "azure-storage-blob>=12.20"
]

serve = [
  "pyngrok>=7.2"
]
